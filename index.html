index.html<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Karen</title>

  <style>
    body {
      margin: 0;
      background: #08090d;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #22242d;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #8175ff 35%, #30248f);
      box-shadow: 0 0 25px #635bff;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .status {
      color: #72e6a3;
      font-size: 13px;
      margin-top: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #969aa7;
      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      margin-top: 25px;
      padding: 16px 25px;
      border-radius: 18px;
      border: none;
      background: #7065ff;
      color: white;
      font-size: 16px;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #22242d;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 18px;
      border: 1px solid #292c37;
      background: #12141b;
      color: white;
      font-size: 16px;
    }

    .send {
      width: 50px;
      border: none;
      border-radius: 18px;
      background: #7065ff;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo"></div>

    <div>
      <h1>KAREN</h1>
      <div class="status">● Prototype en ligne</div>
    </div>
  </header>

  <main>

    <h2>Bonjour 👋</h2>

    <p>
      Je suis Karen.<br>
      Ton assistante personnelle IA.
    </p>

    <button class="button" onclick="bonjour()">
      Parler à Karen
    </button>

  </main>

  <div class="input-area">

    <input
      id="message"
      type="text"
      placeholder="Écris à Karen..."
    >

    <button class="send" onclick="envoyer()">
      ➤
    </button>

  </div>

  <script>

    function bonjour() {
      alert("Bonjour 👋 Je suis Karen !");
    }

    function envoyer() {

      const message =
        document.getElementById("message").value;

      if (message.trim() === "") {
        return;
      }

      alert(
        "Karen a reçu : " + message
      );

      document.getElementById("message").value = "";
    }

  </script>

</body>
</html>
